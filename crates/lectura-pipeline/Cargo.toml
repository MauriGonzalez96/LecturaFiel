[package]
name = "lectura-pipeline"
version = "0.1.0"
edition = "2021"
description = "Motor léxico de Lectura Fiel (WASM / nativo)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
