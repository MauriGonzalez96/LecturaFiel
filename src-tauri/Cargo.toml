[package]
name = "lectura-fiel"
version = "0.3.13"
description = "Lectura Fiel — audiolibro con simplificación léxica selectiva"
authors = ["Lectura Fiel"]
edition = "2021"

[lib]
name = "lectura_fiel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
msedge-tts = { version = "0.4", default-features = true }
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
