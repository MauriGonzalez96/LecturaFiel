# Build Tauri (Windows) en tags v* — convive con el release PyInstaller.

name: Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: npm ci
        run: npm ci

      - name: Tests JS
        run: npm test

      - name: Tests pipeline Rust
        run: cargo test -p lectura-pipeline

      - name: Build WASM smoke
        run: npm run wasm:pipeline

      - name: Sync version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); const v=process.env.VER; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=v; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          node -e "const fs=require('fs'); const v=process.env.VER; const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); c.version=v; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');"
          sed -i "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml
        env:
          VER: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VER }}
          releaseName: Lectura Fiel v${{ env.VER }} (Tauri)
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
