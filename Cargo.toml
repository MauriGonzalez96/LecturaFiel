[workspace]
resolver = "2"
members = ["src-tauri", "crates/lectura-pipeline"]

[profile.release]
# unwind: un panic en un comando TTS no debe matar toda la app
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# wasm-bindgen necesita la sección target_features
[profile.release.package.lectura-pipeline]
strip = false
